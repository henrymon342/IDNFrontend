  <div class="container">
    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">

      <mat-form-field appearance="outline">
        <mat-label>Ronda</mat-label>
        <input matInput formControlName="ronda" />
        <mat-error *ngIf="form.get('ronda')?.hasError('required') && form.get('ronda')?.touched">Este campo es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ministerio</mat-label>
        <input matInput formControlName="ministerio" />
        <mat-error *ngIf="form.get('ministerio')?.hasError('required') && form.get('ministerio')?.touched">Este campo es obligatorio</mat-error>
      </mat-form-field>

      <div class="boton">
        <button mat-icon-button type="submit" matTooltip="cerrar sesión">
          <mat-icon>search</mat-icon>
        </button>
      </div>
    </form>



  </div>

  <div class="candidad">
    <ng-container *ngIf="responseData?.length > 0; else noCandidatos">
      <div class="candidato-card" *ngFor="let candidato of responseData; let i = index">
        <div class="card-header">
          <h3 class="candidato-nombre">{{ candidato.nombre | titlecase }}</h3>
          <span class="candidato-cargo">{{ candidato.cargo }}</span>
        </div>
        <div class="card-body">
          <div class="candidato-count">
            <span class="count-label">Cantidad:</span>
            <span class="count-value">{{ candidato.count }}</span>
          </div>
          </div>
      </div>
    </ng-container>

    <ng-template #noCandidatos>
      <div class="no-candidatos">
        <p>No hay candidatos disponibles para mostrar.</p>
      </div>
    </ng-template>
  </div>
