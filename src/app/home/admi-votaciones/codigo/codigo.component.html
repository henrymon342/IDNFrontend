<mat-drawer-container class="example-container" autosize>
  <mat-drawer #drawer class="example-sidenav" mode="over" position="end" (closed)="onClose()">
    <!-- <votante-form [drawer]="drawer" [votanteId]="votanteId" (closeDrawer)="onClose($event)"></votante-form> -->
  </mat-drawer>

  <div class="example-sidenav-content">
    <div class="container">
      <header class="header">
        <mat-form-field class="input-search">
          <mat-label>Buscar codigo</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input>
        </mat-form-field>

        <button mat-icon-button (click)="downloadData()" title="descargar excel">
          <mat-icon color="primary" class="material-symbols-outlined">
            download
          </mat-icon>
        </button>

        <button mat-icon-button (click)="openVotanteForm()">
          <mat-icon class="blue-icon">add</mat-icon>
        </button>

      </header>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

          <ng-container matColumnDef="Nro">
            <th mat-header-cell *matHeaderCellDef> Nro. </th>
            <td mat-cell *matCellDef="let element; let i = index"> {{ i+1 }} </td>
          </ng-container>

          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef> Codigo (CI) </th>
            <td mat-cell *matCellDef="let element"> {{ element.code }} </td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef> Estado </th>
            <td mat-cell *matCellDef="let element"> {{ element.available }} </td>
          </ng-container>

          <ng-container matColumnDef="mas">
            <th mat-header-cell *matHeaderCellDef> Más </th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button (click)="openVotanteForm(element)">
                <mat-icon class="blue-icon">edit_outline</mat-icon>
              </button>

              <button mat-icon-button (click)="openDeleteDelegadoDialog(element.id)">
                <mat-icon class="red-icon">delete_outline</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</mat-drawer-container>
