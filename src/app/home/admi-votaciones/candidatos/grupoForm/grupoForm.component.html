

  <div class="container">
    <div class="header">
      <h2>{{title==undefined?'Añadir':'Modificar'}} Grupo</h2>
      <button mat-icon-button matMiniFab (click)="cerrar(false)">
        <mat-icon class="blue-icon" color="warn">close</mat-icon>
      </button>
    </div>
  <form class="form" [formGroup]="form">

    <!-- Nombre -->
    <mat-form-field appearance="outline">
      <mat-label>Cargo</mat-label>
      <input matInput formControlName="cargo" />
      <mat-error *ngIf="form.get('cargo')?.hasError('required') && form.get('cargo')?.touched">Este campo es obligatorio</mat-error>
    </mat-form-field>

    <!-- Nombre -->
    <!-- <mat-form-field appearance="outline">
      <mat-label>Por cuantos votar</mat-label>
      <input matInput formControlName="cantidad" />
      <mat-error *ngIf="form.get('cantidad')?.hasError('required') && form.get('cantidad')?.touched">Este campo es obligatorio</mat-error>
    </mat-form-field> -->

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="grid-column: span 2;">

      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="congregacion">
        <th mat-header-cell *matHeaderCellDef> Congregación </th>
        <td mat-cell *matCellDef="let element"> {{element.congregacion}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="cargo">
        <th mat-header-cell *matHeaderCellDef> Cargo </th>
        <td mat-cell *matCellDef="let element"> {{element.cargo}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          (click)="selection.toggle(row)">
      </tr>
    </table>

    <button mat-raised-button color="primary" (click)="onSubmit()" class="unir-columnas">
      {{title==undefined?'Añadir':'Modificar'}}
    </button>
  </form>
</div>
